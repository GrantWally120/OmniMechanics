/* OmniMechanics design system.
 * Concept: a workshop drawing office. Light theme is engineering pad paper
 * (cool grey-green, ruled grid), dark theme is a cyanotype blueprint. One accent,
 * a highlighter yellow, marks what is active. Drawings sit on a framed sheet with
 * a title block. Type: Archivo (wide and heavy for headings, regular for text),
 * system mono for readouts. */

:root {
  --paper: #ebf0e8;
  --paper-2: #f7f9f3;
  --ink: #14201a;
  --ink-2: #44554a;
  --ink-3: #6b7a70;
  --line: #c9d3c8;
  --line-strong: #94a598;
  --grid: rgba(24, 58, 42, 0.085);
  --grid-major: rgba(24, 58, 42, 0.16);
  --accent: #f5c400;
  --accent-ink: #14201a;
  --accent-soft: rgba(245, 196, 0, 0.34);
  --focus: #14201a;

  --c-hot: #d1440d;
  --c-cold: #2364ab;
  --c-elec: #0b8793;
  --c-good: #23784a;
  --c-warn: #a15f00;
  --c-bad: #b3261e;
  --c-metal: #8d9b92;
  --c-metal-2: #c3cdc6;
  --c-metal-d: #55655b;
  --c-glass: rgba(35, 100, 171, 0.14);

  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --space-16: 64px;
  --radius: 3px;
  --rail-w: 264px;
  --header-h: 56px;
  --gutter: clamp(16px, 3.2vw, 40px);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b1a2c;
    --paper-2: #11243a;
    --ink: #e6eefa;
    --ink-2: #aabdd3;
    --ink-3: #8196af;
    --line: #22405f;
    --line-strong: #3b5f86;
    --grid: rgba(120, 170, 235, 0.085);
    --grid-major: rgba(120, 170, 235, 0.17);
    --accent: #ffd23f;
    --accent-ink: #0b1a2c;
    --accent-soft: rgba(255, 210, 63, 0.3);
    --focus: #ffd23f;
    --c-hot: #ff7d4d;
    --c-cold: #6fb3ff;
    --c-elec: #4dd4e0;
    --c-good: #5fd390;
    --c-warn: #ffc14d;
    --c-bad: #ff7a70;
    --c-metal: #6f86a0;
    --c-metal-2: #2b4460;
    --c-metal-d: #a8bdd4;
    --c-glass: rgba(111, 179, 255, 0.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0b1a2c;
  --paper-2: #11243a;
  --ink: #e6eefa;
  --ink-2: #aabdd3;
  --ink-3: #8196af;
  --line: #22405f;
  --line-strong: #3b5f86;
  --grid: rgba(120, 170, 235, 0.085);
  --grid-major: rgba(120, 170, 235, 0.17);
  --accent: #ffd23f;
  --accent-ink: #0b1a2c;
  --accent-soft: rgba(255, 210, 63, 0.3);
  --focus: #ffd23f;
  --c-hot: #ff7d4d;
  --c-cold: #6fb3ff;
  --c-elec: #4dd4e0;
  --c-good: #5fd390;
  --c-warn: #ffc14d;
  --c-bad: #ff7a70;
  --c-metal: #6f86a0;
  --c-metal-2: #2b4460;
  --c-metal-d: #a8bdd4;
  --c-glass: rgba(111, 179, 255, 0.16);
  color-scheme: dark;
}

/* ---------------------------------------------------------------- base */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--header-h) + 16px); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 16px/1.65 var(--font-body);
  font-stretch: 100%;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
body.no-scroll { overflow: hidden; }
img, canvas, svg { max-width: 100%; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
code, .mono { font-family: var(--font-mono); font-size: 0.92em; }
code { background: var(--accent-soft); padding: 0.05em 0.35em; border-radius: 2px; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 100; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; font-weight: 700; }
.skip:focus { left: 8px; }

.eyebrow {
  font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  font-stretch: 112%; color: var(--ink-2);
}

/* ---------------------------------------------------------------- header */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1.5px solid var(--ink);
}
.header-in { height: var(--header-h); display: flex; align-items: center; gap: var(--space-4); padding-inline: var(--gutter); }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin-right: auto; }
.brand-mark { flex: none; }
.brand-name { font-stretch: 122%; font-weight: 500; font-size: 17px; letter-spacing: 0.02em; white-space: nowrap; }
.brand-name b { font-weight: 800; }
.top-nav { display: flex; gap: var(--space-1); }
.top-nav a {
  padding: 8px 12px; text-decoration: none; font-size: 14px; font-weight: 600; font-stretch: 108%;
  border-bottom: 3px solid transparent;
}
.top-nav a:hover { border-bottom-color: var(--line-strong); }
.top-nav a[aria-current="page"] { border-bottom-color: var(--accent); }
.hbtn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px;
  background: transparent; border: 1.5px solid var(--ink); border-radius: var(--radius);
  font-size: 13px; font-weight: 600; cursor: pointer;
}
.hbtn:hover { background: var(--accent-soft); }
.menu-btn { display: none; }
.ico { flex: none; }

/* ---------------------------------------------------------------- layout */
.layout { display: block; }
.rail {
  position: fixed; inset: calc(var(--header-h) + env(safe-area-inset-top, 0px)) auto 0 0; z-index: 40;
  width: min(86vw, 320px); overflow-y: auto; padding: var(--space-6) var(--space-4) var(--space-12);
  background: var(--paper-2); border-right: 1.5px solid var(--ink);
  transform: translateX(-102%); transition: transform 0.22s ease;
}
.rail.open { transform: none; }
.rail-backdrop { position: fixed; inset: 0; z-index: 35; background: rgba(8, 18, 12, 0.5); }
.rail-group + .rail-group { margin-top: var(--space-6); }
.rail-h { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-stretch: 112%; color: var(--ink-2); padding: 0 var(--space-2) var(--space-2); }
.rail ul { list-style: none; margin: 0; padding: 0; }
.rail a {
  display: grid; grid-template-columns: 26px 1fr 14px; align-items: center; gap: 6px;
  min-height: 40px; padding: 4px var(--space-2); text-decoration: none; font-size: 14.5px; font-weight: 500;
  border-left: 4px solid transparent;
}
.rail a:hover { background: var(--accent-soft); }
.rail a[aria-current="page"] { border-left-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.rail-no { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
.rail-ck { width: 10px; height: 10px; border: 1.5px solid var(--line-strong); }
.rail a.done .rail-ck { background: var(--c-good); border-color: var(--c-good); }
.content { min-width: 0; }
.main { min-width: 0; padding: var(--space-8) var(--gutter) var(--space-12); max-width: 1320px; margin-inline: auto; outline: none; container-type: inline-size; container-name: main; }
.site-footer { padding: var(--space-6) var(--gutter) var(--space-12); font-size: 13px; color: var(--ink-2); display: grid; gap: 4px; border-top: 1px solid var(--line); max-width: 1320px; margin-inline: auto; }

@media (min-width: 1180px) {
  .menu-btn { display: none; }
  .layout { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); }
  .rail { position: sticky; top: calc(var(--header-h) + env(safe-area-inset-top, 0px)); inset: auto; align-self: start; height: calc(100vh - var(--header-h)); transform: none; width: auto; transition: none; z-index: 1; }
  .rail-backdrop { display: none; }
}
@media (max-width: 1179px) {
  .menu-btn { display: inline-flex; }
  .brand { margin-right: auto; }
}
@media (max-width: 520px) {
  .hbtn-lbl { display: none; }
  .hbtn { padding: 0 10px; }
  .top-nav a { padding: 8px 8px; }
  .brand-name { font-size: 15px; }
}

/* ---------------------------------------------------------------- hero */
.hero { display: grid; gap: var(--space-8); align-items: center; padding-bottom: var(--space-12); }
.hero-copy { display: grid; gap: var(--space-4); max-width: 640px; }
.hero h1, .mech-head h1 {
  font-stretch: 122%; font-weight: 800; letter-spacing: -0.012em; line-height: 1.04;
  font-size: clamp(34px, 6.2vw, 64px);
}
.mech-head h1 { font-size: clamp(30px, 4.6vw, 48px); }
.mark { background: linear-gradient(transparent 58%, var(--accent) 58%, var(--accent) 92%, transparent 92%); padding: 0 0.06em; }
.hero-sub { font-size: clamp(16px, 1.6vw, 19px); color: var(--ink-2); max-width: 54ch; }
.hero-art { justify-self: stretch; max-width: 460px; }
.hero-canvas { display: block; width: 100%; }
@media (min-width: 860px) { .hero { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } .hero-art { justify-self: end; width: 100%; } }

/* ---------------------------------------------------------------- library */
.lib-tools { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: center; justify-content: space-between; padding-bottom: var(--space-6); border-bottom: 1.5px solid var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chip {
  min-height: 40px; padding: 0 14px; background: transparent; border: 1.5px solid var(--ink); border-radius: var(--radius);
  font-size: 13.5px; font-weight: 600; cursor: pointer;
}
.chip:hover { background: var(--accent-soft); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.lib-search-wrap { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.search {
  min-height: 40px; width: min(260px, 100%); padding: 0 12px; font: inherit; font-size: 14px; color: var(--ink);
  background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: var(--radius);
}
.search::placeholder { color: var(--ink-3); }
.lib-count { font-size: 13px; color: var(--ink-2); font-family: var(--font-mono); }
.lib-group { padding-top: var(--space-8); }
.lib-group-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2) var(--space-4); margin-bottom: var(--space-4); }
.lib-group-h h2 { font-stretch: 116%; font-weight: 800; font-size: 20px; letter-spacing: -0.005em; }
.lib-group-h p { color: var(--ink-2); font-size: 14px; }
.cards { display: grid; gap: var(--space-6); grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); }
.card {
  display: grid; grid-template-rows: auto 1fr; text-decoration: none; background: var(--paper-2);
  border: 1.5px solid var(--ink); border-radius: var(--radius); overflow: hidden;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.card:hover { transform: translate(-3px, -3px); box-shadow: 5px 5px 0 var(--accent); }
.card:focus-visible { transform: translate(-3px, -3px); box-shadow: 5px 5px 0 var(--accent); }
.thumb-wrap {
  aspect-ratio: 16 / 10; border-bottom: 1.5px solid var(--ink); position: relative;
  background-color: var(--paper-2);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 16px 16px;
}
.thumb { position: absolute; inset: 0; width: 100%; height: 100%; }
.card-body { padding: var(--space-4); display: grid; gap: 6px; align-content: start; }
.card-top { display: flex; justify-content: space-between; align-items: center; min-height: 20px; }
.card-no { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); letter-spacing: 0.04em; }
.card-done { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: var(--c-good); color: var(--paper-2); padding: 2px 7px; border-radius: 2px; }
.card h3 { font-stretch: 112%; font-weight: 800; font-size: 19px; line-height: 1.2; }
.card p { font-size: 14.5px; color: var(--ink-2); line-height: 1.5; }
.empty { padding: var(--space-8) 0; color: var(--ink-2); }

/* ---------------------------------------------------------------- mechanism page */
.mech-head { display: grid; gap: var(--space-3); padding-bottom: var(--space-6); max-width: 820px; }
.mech-hook { font-size: clamp(16px, 1.5vw, 19px); color: var(--ink-2); max-width: 62ch; }
.mech-grid { display: grid; gap: var(--space-8); }
.mech-stage { display: grid; gap: var(--space-6); align-content: start; min-width: 0; }
.mech-notes { display: grid; gap: var(--space-8); align-content: start; min-width: 0; max-width: 720px; }
@container main (min-width: 1040px) {
  .mech-grid { grid-template-columns: minmax(0, 1.5fr) minmax(340px, 1fr); gap: var(--space-12); align-items: start; }
  .mech-stage { position: sticky; top: calc(var(--header-h) + 16px); }
}

.sheet {
  position: relative; background: var(--paper-2); border: 1.5px solid var(--ink);
}
.sheet::after { content: ""; position: absolute; inset: 4px; border: 1px solid var(--line-strong); pointer-events: none; z-index: 2; }
.sheet-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-bottom: 1.5px solid var(--ink); background: var(--paper); position: relative; z-index: 3; }
.tool {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; min-width: 40px; justify-content: center; padding: 0 10px;
  background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer;
}
.tool:hover { background: var(--accent-soft); }
.tool:active { background: var(--accent); color: var(--accent-ink); }
.sheet-caption { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; font-stretch: 108%; min-height: 40px; }
.cap-dot { width: 10px; height: 10px; background: var(--accent); border: 1.5px solid var(--ink); flex: none; }
.cap-text:empty + .cap-dot, .sheet-caption:has(.cap-text:empty) { visibility: hidden; }
.sheet-notice { padding: var(--space-2) var(--space-4); font-size: 13px; background: var(--accent-soft); border-bottom: 1px solid var(--line-strong); position: relative; z-index: 3; }
.sheet-stage {
  position: relative; z-index: 1; line-height: 0;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(var(--grid-major) 1px, transparent 1px), linear-gradient(90deg, var(--grid-major) 1px, transparent 1px);
  background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
  min-height: 200px;
}
.sheet-canvas { display: block; touch-action: pan-y; }
.sheet-canvas.focusable:focus-visible { outline-offset: -4px; }
.readouts {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); margin: 0; border-top: 1.5px solid var(--ink);
  position: relative; z-index: 3; background: var(--paper-2);
}
.ro { padding: 8px 12px 9px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; gap: 1px; min-width: 0; }
.ro dt { font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); font-stretch: 108%; }
.ro dd { margin: 0; font-family: var(--font-mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.3; }
.ro dd[data-tone="good"] { color: var(--c-good); }
.ro dd[data-tone="warn"] { color: var(--c-warn); }
.ro dd[data-tone="bad"] { color: var(--c-bad); }
.titleblock { display: grid; grid-template-columns: 0.8fr 2fr 1.4fr 1.2fr; border-top: 1.5px solid var(--ink); position: relative; z-index: 3; background: var(--paper); }
.tb-cell { padding: 6px 12px; border-right: 1px solid var(--line-strong); display: grid; min-width: 0; }
.tb-cell:last-child { border-right: 0; }
.tb-k { font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
.tb-v { font-size: 12.5px; font-weight: 600; font-family: var(--font-mono); overflow-wrap: anywhere; }
@media (max-width: 620px) {
  .titleblock { grid-template-columns: 1fr 1fr; }
  .tb-cell { border-bottom: 1px solid var(--line-strong); }
}

/* controls */
.controls { display: grid; gap: var(--space-4) var(--space-8); grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); padding: var(--space-4) var(--space-4) var(--space-6); background: var(--paper-2); border: 1.5px solid var(--ink); }
.ctl { display: grid; gap: 4px; align-content: start; min-width: 0; }
.ctl-heading { grid-column: 1 / -1; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-stretch: 112%; color: var(--ink-2); border-bottom: 1px solid var(--line-strong); padding-bottom: 4px; margin-top: var(--space-2); }
.ctl-heading:first-child { margin-top: 0; }
.ctl-row { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.ctl label, .ctl-label { font-size: 14px; font-weight: 600; }
.ctl-val { font-family: var(--font-mono); font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ctl-hint { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 32px; margin: 0; background: transparent; cursor: pointer; --fill: 0%; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(var(--ink), var(--ink)) 0 / var(--fill) 100% no-repeat, var(--line-strong); }
input[type="range"]::-moz-range-track { height: 4px; background: var(--line-strong); }
input[type="range"]::-moz-range-progress { height: 4px; background: var(--ink); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 26px; margin-top: -11px; background: var(--accent); border: 2px solid var(--ink); border-radius: 2px; }
input[type="range"]::-moz-range-thumb { width: 10px; height: 22px; background: var(--accent); border: 2px solid var(--ink); border-radius: 2px; }
input[type="range"]:focus-visible { outline-offset: 0; }
input[type="range"]:focus-visible::-webkit-slider-thumb { outline: 3px solid var(--focus); outline-offset: 2px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--ink); border-radius: var(--radius); overflow: hidden; background: var(--paper-2); }
.seg button { min-height: 40px; padding: 0 12px; background: transparent; border: 0; border-right: 1.5px solid var(--ink); font-size: 13.5px; font-weight: 600; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--accent-soft); }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
.seg-small button { min-height: 40px; padding: 0 10px; font-family: var(--font-mono); font-size: 12.5px; }
.ctl-seg .seg { justify-self: start; max-width: 100%; }
.ctl-toggle { grid-template-columns: 1fr auto; align-items: center; }
.ctl-toggle .ctl-hint { grid-column: 1 / -1; }
.switch { position: relative; width: 52px; height: 28px; padding: 0; background: var(--paper); border: 1.5px solid var(--ink); border-radius: var(--radius); cursor: pointer; }
.switch .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: var(--ink); transition: transform 0.15s ease, background 0.15s ease; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"] .knob { transform: translateX(24px); }
.btn { min-height: 42px; padding: 0 16px; background: var(--paper); border: 1.5px solid var(--ink); border-radius: var(--radius); font-size: 14px; font-weight: 700; cursor: pointer; }
.btn:hover { background: var(--accent-soft); }
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover { background: var(--ink); box-shadow: 3px 3px 0 var(--accent); }
.ctl-button { align-content: end; }

/* ---------------------------------------------------------------- notes */
.notes-sec { display: grid; gap: var(--space-4); }
.notes-sec > h2, .myth h2 { font-stretch: 118%; font-weight: 800; font-size: 22px; letter-spacing: -0.005em; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-3); counter-reset: step; }
.step { position: relative; padding: var(--space-3) var(--space-4) var(--space-3) 52px; border: 1.5px solid var(--line-strong); border-radius: var(--radius); background: var(--paper-2); counter-increment: step; }
.step::before {
  content: counter(step); position: absolute; left: 12px; top: 12px; width: 28px; height: 28px; display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 13px; font-weight: 700; border: 1.5px solid var(--ink); background: var(--paper);
}
.step h3 { font-size: 16px; font-weight: 700; font-stretch: 108%; margin-bottom: 2px; }
.step p { font-size: 15px; color: var(--ink-2); }
.step.is-now { border-color: var(--ink); box-shadow: 4px 4px 0 var(--accent); }
.step.is-now::before { background: var(--accent); color: var(--accent-ink); }
.step.is-now p { color: var(--ink); }
.lead { font-size: 17px; line-height: 1.6; }
.eq { margin: 0; border: 1.5px solid var(--ink); background: var(--paper-2); }
.eq figcaption { padding: 5px 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; background: var(--paper); border-bottom: 1px solid var(--line-strong); color: var(--ink-2); }
.eq-line { padding: 10px 12px; font-family: var(--font-mono); font-size: 16px; font-weight: 600; overflow-x: auto; white-space: nowrap; }
.eq-note { padding: 0 12px 10px; font-size: 13.5px; color: var(--ink-2); }
.points { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.points li::marker { color: var(--ink); }
.myth { border: 1.5px dashed var(--ink); padding: var(--space-4) var(--space-4) var(--space-4); display: grid; gap: var(--space-2); background: var(--paper-2); }
.tag { font-size: 11px !important; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c-bad); font-stretch: 110%; }
.tag-true { color: var(--c-good); margin-top: var(--space-2); }
.claim { font-size: 17px; font-weight: 600; font-style: italic; }
.tries { display: grid; gap: var(--space-2); }
.try { display: grid; gap: 2px; text-align: left; padding: 10px 14px; background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: var(--radius); cursor: pointer; }
.try:hover { background: var(--accent-soft); }
.try[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.try-l { font-weight: 700; font-size: 15px; }
.try-t { font-size: 13.5px; opacity: 0.85; }
.q { border: 0; padding: 0; margin: 0 0 var(--space-6); min-width: 0; display: grid; gap: var(--space-3); }
.q legend { display: flex; gap: 10px; align-items: baseline; font-weight: 700; font-size: 16px; padding: 0; margin-bottom: 4px; }
.q-n { flex: none; font-family: var(--font-mono); font-size: 12px; border: 1.5px solid var(--ink); padding: 0 6px; }
.opts { display: grid; gap: var(--space-2); }
.opt { display: grid; grid-template-columns: 28px 1fr; gap: 10px; text-align: left; padding: 10px 12px; background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: var(--radius); cursor: pointer; font-size: 15px; }
.opt:hover:not(:disabled) { background: var(--accent-soft); }
.opt-k { font-family: var(--font-mono); font-weight: 700; }
.opt.right { background: var(--c-good); color: var(--paper-2); border-color: var(--c-good); }
.opt.wrong { border-style: dashed; color: var(--ink-3); text-decoration: line-through; }
.opt:disabled:not(.right):not(.wrong) { opacity: 0.6; cursor: default; }
.quiz-fb p { font-size: 14.5px; padding: 10px 12px; border-left: 4px solid var(--c-good); background: var(--paper-2); }
.quiz-fb .fb-no { border-left-color: var(--c-bad); }
.quiz-status { font-size: 13px; font-family: var(--font-mono); color: var(--ink-2); }
.sources { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }
.prevnext { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-4); margin-top: var(--space-12); padding-top: var(--space-6); border-top: 1.5px solid var(--ink); }
.pn { display: grid; gap: 2px; text-decoration: none; padding: 10px 14px; border: 1.5px solid var(--ink); border-radius: var(--radius); background: var(--paper-2); min-width: min(100%, 220px); }
.pn:hover { background: var(--accent-soft); }
.pn-next { text-align: right; margin-left: auto; }
.pn-k { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
.pn-t { font-weight: 800; font-stretch: 112%; }

/* ---------------------------------------------------------------- about */
.about-grid { display: grid; gap: var(--space-8); max-width: 760px; }
.about-grid p { max-width: 66ch; }
.about-grid .notes-sec p + p { margin-top: var(--space-2); }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
.legend li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; }
.sw { width: 22px; height: 22px; border: 1.5px solid var(--ink); margin-top: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; scroll-behavior: auto !important; }
}
@media print { .site-header, .rail, .sheet-bar, .controls { display: none; } }

<body>
<div id="app"></div>
<noscript><p style="padding:24px;font:16px/1.6 system-ui,sans-serif">OmniMechanics is made of live simulations, so it needs JavaScript switched on.</p></noscript>
<script>
/* ---- core/00-util.js ---- */
/* Small utilities shared by everything else: maths helpers, a tiny DOM
 * builder, a safe rich-text parser (no innerHTML anywhere), and guarded
 * localStorage. */
(function (root) {
  'use strict';
  const OM = root.OM || (root.OM = {});

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const wrap = (v, m) => ((v % m) + m) % m;
  const smooth = (t) => t * t * (3 - 2 * t);
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;

  // Number formatting with a real minus sign and thousands separators.
  function fmt(v, d) {
    if (!Number.isFinite(v)) return '–';
    const s = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
    return (v < 0 && Number(s.replace(/,/g, '')) !== 0 ? '−' : '') + s;
  }

  // ---- DOM builder -------------------------------------------------------
  const SVG_NS = 'http://www.w3.org/2000/svg';
  function h(tag, props) {
    const svg = tag.charAt(0) === '@';
    const el = svg ? document.createElementNS(SVG_NS, tag.slice(1)) : document.createElement(tag);
    if (props) {
      for (const k of Object.keys(props)) {
        const v = props[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.setAttribute('class', v);
        else if (k === 'on') for (const ev of Object.keys(v)) el.addEventListener(ev, v[ev]);
        else if (k === 'dataset') for (const d of Object.keys(v)) el.dataset[d] = v[d];
        else if (k === 'text') el.textContent = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, String(v));
      }
    }
    for (let i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, kid) {
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) kid.forEach((k) => append(el, k));
    else if (kid instanceof Node) el.appendChild(kid);
    else el.appendChild(document.createTextNode(String(kid)));
  }
  function clear(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
    return el;
  }

  // ---- Rich text ---------------------------------------------------------
  // **bold**  *italic*  `code`  ~subscript~  ^superscript^
  const RICH = /(\*\*[^*]+\*\*|\*[^*\s][^*]*\*|`[^`]+`|~[^~\s]+~|\^[^^\s]+\^)/;
  function rich(str) {
    const frag = document.createDocumentFragment();
    String(str).split(RICH).forEach((part) => {
      if (!part) return;
      if (part.startsWith('**') && part.endsWith('**') && part.length > 4) frag.appendChild(h('strong', { text: part.slice(2, -2) }));
      else if (part.startsWith('`') && part.endsWith('`') && part.length > 2) frag.appendChild(h('code', { text: part.slice(1, -1) }));
      else if (part.startsWith('*') && part.endsWith('*') && part.length > 2) frag.appendChild(h('em', { text: part.slice(1, -1) }));
      else if (part.startsWith('~') && part.endsWith('~') && part.length > 2) frag.appendChild(h('sub', { text: part.slice(1, -1) }));
      else if (part.startsWith('^') && part.endsWith('^') && part.length > 2) frag.appendChild(h('sup', { text: part.slice(1, -1) }));
      else frag.appendChild(document.createTextNode(part));
    });
    return frag;
  }
  const richText = (str) => str.replace(/\*\*|\*|`|~|\^/g, '');

  // ---- Storage (never throws) -------------------------------------------
  const KEY = 'omnimech:v2';
  let memory = {};
  const store = {
    all() {
      try {
        const s = localStorage.getItem(KEY);
        if (s) memory = JSON.parse(s) || {};
      } catch (e) { /* private mode or blocked: keep the in-memory copy */ }
      return memory;
    },
    get(k, dflt) {
      const a = store.all();
      return k in a ? a[k] : dflt;
    },
    set(k, v) {
      memory[k] = v;
      try { localStorage.setItem(KEY, JSON.stringify(memory)); } catch (e) { /* ignore */ }
    },
  };

  // Collect every finite-number problem in a plain object (used by the tests).
  function findBadNumbers(obj, path, out, depth) {
    out = out || [];
    path = path || 'state';
    depth = depth || 0;
    if (depth > 6 || obj == null) return out;
    if (typeof obj === 'number') {

        { q: 'Why does the spark fire before the piston reaches the top of the compression stroke?', opts: ['The flame takes time to spread, so the pressure peak should land just after the top', 'Fuel burns faster while the piston is rising', 'To clear the exhaust from the last cycle', 'So the valves have time to close'], a: 0, why: 'The mixture needs several milliseconds to burn. Lighting it early puts the pressure peak about 10 to 15° after the top, where it pushes the piston hardest.' },
        { q: 'Why does a nearly closed throttle waste energy during the intake stroke?', opts: ['The spark gets weaker', 'The piston must pull air past the restriction, so the cylinder pressure drops far below the exhaust side and the stroke costs work', 'Less air makes the crank heavier', 'It does not, the piston coasts'], a: 1, why: 'The pressure during intake falls well below the exhaust pressure, so the piston does negative work. The pumping loop on the diagram shows it.' },
      ],
      sources: [
        'J. B. Heywood, *Internal Combustion Engine Fundamentals*, McGraw-Hill (1988).',
        'Y. A. Çengel and M. A. Boles, *Thermodynamics: An Engineering Approach* (the Otto cycle).',
      ],
    },

    create(host) {
      const st = { phi: 30, t: 0 };
      let res = null;
      let L = null;

      function recompute() {
        const c = host.ctl;
        res = E.cycle({ cr: c.cr, load: c.load / 100, spark: c.spark, timing: c.timing });
      }
      const dispRps = () => 0.6 + (2.0 * (host.ctl.rpm - 600)) / 6400;

      const sim = {
        ref: { w: 780, h: 500 },
        refNarrow: { w: 420, h: 780 },
        state: st,
        init() { st.phi = 30; st.t = 0; recompute(); },
        onControl() { recompute(); },
        layout(V) {
          if (V.narrow) {
            L = {
              eng: { x: 50, y: 6, k: 320 / 400 },
              pv: { x: 10, y: 400, w: 400, h: 210 },
              tl: { x: 10, y: 622, w: 400, h: 150 },
            };
          } else {
            L = {
              eng: { x: 10, y: 10, k: 0.98 },
              pv: { x: 430, y: 10, w: 340, h: 300 },
              tl: { x: 430, y: 330, w: 340, h: 160 },
            };
          }
        },
        step(dt) {
          st.t += dt;
          st.phi = (st.phi + dt * dispRps() * 360) % 720;
        },
        thumb() { st.phi = 378; },
        stepSize: 0.12,

        readouts() {
          const s = E.at(res, st.phi);
          const rpm = host.ctl.rpm;
          const slow = rpm / 60 / dispRps();
          return [
            { k: 'Stroke', v: STROKE_NAMES[s.stroke] },
            { k: 'Cycle angle', v: fmt(s.phi, 0) + '° of 720' },
            { k: 'Pressure now', v: fmt(s.P / 1e5, 1) + ' bar' },
            { k: 'Peak pressure', v: fmt(res.stats.pMaxBar, 0) + ' bar' },
            { k: 'Peak comes', v: fmt(Math.abs(res.stats.peakAtdc), 0) + '° ' + (res.stats.peakAtdc >= 0 ? 'after' : 'before') + ' TDC', tone: res.stats.peakAtdc < 5 || res.stats.peakAtdc > 25 ? 'warn' : 'good' },
            { k: 'Work per cycle', v: fmt(res.stats.workNetJ, 0) + ' J' },
            { k: 'Pumping loss', v: fmt(res.stats.imepPump, 2) + ' bar', tone: res.stats.imepPump < -0.5 ? 'warn' : '' },
            { k: 'Power', v: fmt(E.powerKw(res, rpm), 1) + ' kW' },
            { k: 'Slow motion', v: '÷ ' + fmt(slow, 0) },
          ];
        },
        caption() {
          const s = E.at(res, st.phi);
          let t = STROKE_NAMES[s.stroke] + ' stroke';
          if (s.iv > 0.05 && s.ev > 0.05) t = 'Valve overlap';
          const sp = 360 - host.ctl.spark;
          if (Math.abs(E.mod(st.phi - sp + 360, 720) - 360) < 4) t = 'Spark';
          return t;
        },
        phase() { return E.at(res, st.phi).stroke; },
        describe() {
          const s = E.at(res, st.phi);
          return STROKE_NAMES[s.stroke] + ' stroke, cylinder pressure ' + fmt(s.P / 1e5, 1) + ' bar. Net work ' + fmt(res.stats.workNetJ, 0) + ' joules per cycle.';
        },

        draw(g, V, c) {
          const s = E.at(res, st.phi);
          drawEngine(g, V, c, s);
          drawPV(g, V, c, s);
          drawTimeline(g, V, c, s);
        },
      };

      // --------------------------------------------------------------- engine
      function drawEngine(g, V, c, s) {
        const k = L.eng.k;
        g.save();
        g.translate(L.eng.x, L.eng.y);
        g.scale(k, k);
        const V2 = Object.assign({}, V, { s: V.s * k, px: (n) => n / (V.s * k) });
        const theta = s.theta;
        const cr = host.ctl.cr;
        const hc = (E.GEO.stroke * 1000) / (cr - 1);
        const yHead = pistonCrown(0) - hc;
        const yc = pistonCrown(theta); // crown top
        const yPin = CY - E.pistonY(theta) * 1000;
        const th = theta * Math.PI / 180;
        const pinX = CX + R * Math.sin(th), pinY = CY - R * Math.cos(th);
        const ink = c.ink, ink2 = c.ink2;
        const lw = (n) => V2.px(n);

        // crankcase outline
        g.strokeStyle = ink; g.lineWidth = lw(1.5);
        g.beginPath();
        g.moveTo(XOL, 322); g.lineTo(XOL, CY);
        g.arc(CX, CY, CX - XOL, Math.PI, 0, true);
        g.lineTo(XOR, 322);
        g.stroke();

        // block walls (cut metal)
        for (const [x, w] of [[XOL, WALL], [XR, WALL]]) {
          g.fillStyle = c.paper2; g.fillRect(x, yHead, w, 322 - yHead);
          hatchRect(g, V2, x, yHead, w, 322 - yHead, { gap: 8, color: c.line });
          g.strokeStyle = ink; g.lineWidth = lw(1.5); g.strokeRect(x, yHead, w, 322 - yHead);
        }

        // gas in the chamber
        const chH = Math.max(0, yc - yHead);
        g.save();
        g.beginPath(); g.rect(XL, yHead, BORE, chH); g.clip();
        const flowing = s.iv > 0.02 || s.ev > 0.02;
        if (flowing) {
          const col = s.iv >= s.ev ? c.cold : c.metal;
          g.fillStyle = alpha(col, 0.22 + 0.25 * clamp(s.P / 1.2e5, 0, 1));
          g.fillRect(XL, yHead, BORE, chH);
        } else {
          g.fillStyle = alpha(c.cold, 0.25 + 0.4 * clamp(s.P / 2.5e6, 0, 1));
          g.fillRect(XL, yHead, BORE, chH);
          if (s.xb > 0.001) {
            const hot = alpha(c.hot, 0.38 + 0.5 * clamp((s.T - 1200) / 1400, 0, 1));
            const rf = Math.sqrt(s.xb) * Math.hypot(BORE / 2, chH) * 1.08;
            g.fillStyle = hot;
            g.beginPath(); g.arc(CX, yHead, rf, 0, Math.PI * 2); g.fill();
          }
        }
        g.restore();

        // cylinder head with ports
        g.fillStyle = c.paper2; g.fillRect(XOL, HEAD_TOP, XOR - XOL, yHead - HEAD_TOP);
        hatchRect(g, V2, XOL, HEAD_TOP, XOR - XOL, yHead - HEAD_TOP, { gap: 8, color: c.line });
        g.strokeStyle = ink; g.lineWidth = lw(1.5); g.strokeRect(XOL, HEAD_TOP, XOR - XOL, yHead - HEAD_TOP);
        const port = (pts, col) => {
          g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath();
          g.fillStyle = c.paper2; g.fill();
          g.fillStyle = col; g.fill();
          g.strokeStyle = ink; g.lineWidth = lw(1.5); g.stroke();
        };
        port([[XOL, PIPE_Y1], [XI + 14, PIPE_Y1], [XI + 14, yHead], [XI - 14, yHead], [XI - 14, PIPE_Y2], [XOL, PIPE_Y2]], alpha(c.cold, 0.16));
        port([[XOR, PIPE_Y1], [XE - 14, PIPE_Y1], [XE - 14, yHead], [XE + 14, yHead], [XE + 14, PIPE_Y2], [XOR, PIPE_Y2]], alpha(c.metal, 0.22));
        // pipes outside the head
        for (const [x1, x2, col] of [[24, XOL, alpha(c.cold, 0.16)], [XOR, 380, alpha(c.metal, 0.22)]]) {
          g.fillStyle = c.paper2; g.fillRect(x1, PIPE_Y1, x2 - x1, PIPE_Y2 - PIPE_Y1);
          g.fillStyle = col; g.fillRect(x1, PIPE_Y1, x2 - x1, PIPE_Y2 - PIPE_Y1);
          g.strokeStyle = ink; g.lineWidth = lw(1.5);
          g.beginPath(); g.moveTo(x1, PIPE_Y1); g.lineTo(x2, PIPE_Y1); g.moveTo(x1, PIPE_Y2); g.lineTo(x2, PIPE_Y2); g.stroke();
        }
        // air in, exhaust out: moving chevrons while the valve is open
        const chev = (x0, x1, act, col) => {
          if (act < 0.04) return;
          const gap = 26, off = (st.t * 60) % gap;
          g.strokeStyle = col; g.lineWidth = lw(2); g.globalAlpha = clamp(act * 2, 0, 1);
          for (let x = x0 + off; x < x1 - 8; x += gap) {
            g.beginPath(); g.moveTo(x, 120); g.lineTo(x + 7, 126); g.lineTo(x, 132); g.stroke();
          }
          g.globalAlpha = 1;
        };
        chev(30, XOL - 6, s.iv, c.cold);
        chev(XOR + 6, 374, s.ev, c.metalD);
        text(g, V2, 'AIR + FUEL IN', 24, 104, { px: 10, color: c.ink2, weight: 700 });
        text(g, V2, 'EXHAUST OUT', 380, 104, { px: 10, color: c.ink2, weight: 700, align: 'right' });

        // valves, springs, cams
        const valve = (x, lift, camPhiMid, span, isIntake) => {
          const yv = yHead + lift * LIFT_MAX;
          g.strokeStyle = ink; g.fillStyle = c.metal2; g.lineWidth = lw(1.5);
          // stem
          g.fillRect(x - 2.5, 56 + lift * LIFT_MAX, 5, yv - 5 - (56 + lift * LIFT_MAX));
          g.strokeRect(x - 2.5, 56 + lift * LIFT_MAX, 5, yv - 5 - (56 + lift * LIFT_MAX));
          // head
          g.beginPath();
          g.moveTo(x - 14, yv); g.lineTo(x + 14, yv); g.lineTo(x + 14, yv - 4); g.lineTo(x + 4, yv - 9); g.lineTo(x - 4, yv - 9); g.lineTo(x - 14, yv - 4);
          g.closePath(); g.fill(); g.stroke();
          // spring and retainer
          const yr = 74 + lift * LIFT_MAX;
          spring(g, V2, x, HEAD_TOP, x, yr, 4, 6, c.ink2, 1.3);
          g.fillStyle = c.metalD; g.fillRect(x - 9, yr - 3, 18, 4);
          // cam (turns at half crank speed)
          const cy = 44, R0 = 12;
          const W = span / 2; // degrees of cam angle the lobe covers
          const aRel = E.mod(st.phi - camPhiMid + 360, 720) - 360; // crank degrees from mid-lift
          const rot = (aRel / 2) * Math.PI / 180;
          g.beginPath();
          for (let i = 0; i <= 90; i++) {
            const a = (i / 90) * Math.PI * 2 - Math.PI; // local angle, lobe tip at 0
            const adeg = (a * 180) / Math.PI;
            const r = Math.abs(adeg) <= W / 2 ? R0 + LIFT_MAX * Math.pow(Math.cos((Math.PI * adeg) / W), 2) : R0;
            // screen angle: tip points down (+y) at rot = 0; cam spins clockwise
            const sa = Math.PI / 2 + a + rot;
            const px = x + r * Math.cos(sa), py = cy + r * Math.sin(sa);
            if (i) g.lineTo(px, py); else g.moveTo(px, py);
          }
          g.closePath(); g.fillStyle = c.metal2; g.fill(); g.strokeStyle = ink; g.lineWidth = lw(1.5); g.stroke();
          g.beginPath(); g.arc(x, cy, 3, 0, Math.PI * 2); g.fillStyle = ink; g.fill();
        };
        const T = res.timing;
        const midI = E.mod(T.ivo + ((E.mod(T.ivc - T.ivo, 720)) / 2), 720);
        const midE = E.mod(T.evo + ((E.mod(T.evc - T.evo, 720)) / 2), 720);
        valve(XI, s.iv, midI, E.mod(T.ivc - T.ivo, 720), true);
        valve(XE, s.ev, midE, E.mod(T.evc - T.evo, 720), false);
        text(g, V2, 'cam, half speed', CX, 22, { px: 10, color: c.ink2, align: 'center' });

        // spark plug
        g.fillStyle = c.paper2; g.strokeStyle = ink; g.lineWidth = lw(1.5);
        g.fillRect(CX - 5, 62, 10, 30); g.strokeRect(CX - 5, 62, 10, 30);
        g.fillStyle = c.metalD; g.fillRect(CX - 7, 92, 14, yHead - 92); g.strokeRect(CX - 7, 92, 14, yHead - 92);
        g.beginPath(); g.moveTo(CX, yHead); g.lineTo(CX, yHead + 5); g.strokeStyle = ink; g.stroke();
        const dSpark = E.mod(st.phi - (360 - host.ctl.spark) + 360, 720) - 360;
        if (dSpark > -3 && dSpark < 6 && !flowing) {
          g.strokeStyle = c.accent; g.lineWidth = lw(3);
          g.beginPath(); g.moveTo(CX, yHead + 5); g.lineTo(CX - 6, yHead + 11); g.lineTo(CX + 5, yHead + 16); g.lineTo(CX - 3, yHead + 22); g.stroke();
          const gl = g.createRadialGradient(CX, yHead + 12, 1, CX, yHead + 12, 26);
          gl.addColorStop(0, alpha(c.accent, 0.85)); gl.addColorStop(1, alpha(c.accent, 0));
          g.fillStyle = gl; g.beginPath(); g.arc(CX, yHead + 12, 26, 0, Math.PI * 2); g.fill();
        }

        // piston
        g.fillStyle = c.metal2; g.fillRect(XL + 1.5, yc, BORE - 3, 52);
        hatchRect(g, V2, XL + 1.5, yc, BORE - 3, 52, { gap: 9, color: alpha(c.ink, 0.25) });
        g.strokeStyle = ink; g.lineWidth = lw(1.5); g.strokeRect(XL + 1.5, yc, BORE - 3, 52);
        g.lineWidth = lw(1);
        for (const dy of [8, 14, 20]) { g.beginPath(); g.moveTo(XL + 1.5, yc + dy); g.lineTo(XR - 1.5, yc + dy); g.stroke(); }

        // connecting rod, crank
        g.strokeStyle = c.metalD; g.lineWidth = lw(0) + 13; g.lineCap = 'round';
        g.beginPath(); g.moveTo(CX, yPin); g.lineTo(pinX, pinY); g.stroke();
        g.strokeStyle = c.metal2; g.lineWidth = 7;
        g.beginPath(); g.moveTo(CX, yPin); g.lineTo(pinX, pinY); g.stroke();
        g.lineCap = 'butt';
        // crank web with counterweight
        g.fillStyle = c.metalD;
        g.beginPath(); g.moveTo(CX, CY);
        g.arc(CX, CY, 58, th + Math.PI - 1.0 - Math.PI / 2, th + Math.PI + 1.0 - Math.PI / 2);
        g.closePath(); g.fill();
        g.strokeStyle = c.metalD; g.lineWidth = 11; g.lineCap = 'round';
        g.beginPath(); g.moveTo(CX, CY); g.lineTo(pinX, pinY); g.stroke(); g.lineCap = 'butt';
        // angle scale
        g.strokeStyle = c.ink2; g.lineWidth = lw(1);
        g.beginPath(); g.arc(CX, CY, 66, 0, Math.PI * 2); g.stroke();
        for (let d = 0; d < 360; d += 30) {
          const a = d * Math.PI / 180 - Math.PI / 2;
          g.beginPath(); g.moveTo(CX + Math.cos(a) * 66, CY + Math.sin(a) * 66); g.lineTo(CX + Math.cos(a) * 72, CY + Math.sin(a) * 72); g.stroke();
        }
        g.beginPath(); g.arc(pinX, pinY, 8, 0, Math.PI * 2); g.fillStyle = c.paper2; g.fill(); g.strokeStyle = ink; g.lineWidth = lw(1.5); g.stroke();
        g.beginPath(); g.arc(CX, CY, 5, 0, Math.PI * 2); g.fillStyle = ink; g.fill();
        g.beginPath(); g.arc(CX, yPin, 6, 0, Math.PI * 2); g.fillStyle = c.paper2; g.fill(); g.stroke();
        // marker on the rim
        g.fillStyle = c.accent; g.strokeStyle = ink; g.lineWidth = lw(1.5);
        g.beginPath(); g.arc(CX + Math.sin(th) * 66, CY - Math.cos(th) * 66, 5, 0, Math.PI * 2); g.fill(); g.stroke();
        text(g, V2, 'TDC', CX, CY - 78, { px: 10, color: c.ink2, align: 'center', weight: 700 });
        text(g, V2, 'BDC', CX, CY + 88, { px: 10, color: c.ink2, align: 'center', weight: 700, base: 'top' });
        text(g, V2, 'θ ' + fmt(theta, 0) + '°', CX + 82, CY + 4, { px: 12, color: c.ink, mono: true, weight: 700 });

        // dimensions: stroke
        dim(g, V2, 305, pistonCrown(0), 305, pistonCrown(180), '', 14);
        text(g, V2, 'stroke', 322, (pistonCrown(0) + pistonCrown(180)) / 2 - 4, { px: 10.5, color: c.ink2 });
        text(g, V2, '86 mm', 322, (pistonCrown(0) + pistonCrown(180)) / 2 + 10, { px: 10.5, color: c.ink2, mono: true });
        g.restore();
      }

      // -------------------------------------------------------------- P-V plot
      function drawPV(g, V, c, s) {
        const b = L.pv;
        const x0 = b.x + 40, y0 = b.y + 44, w = b.w - 52, hh = b.h - 88;
        const Vmax = (res.Vc + E.GEO.Vd) * 1.04;
        const Pmax = Math.max(40, Math.ceil((res.stats.pMaxBar * 1.08) / 10) * 10);
        const X = (v) => x0 + (v / Vmax) * w;
        const Y = (p) => y0 + hh - (p / 1e5 / Pmax) * hh;
        text(g, V, 'Pressure (bar) against volume', b.x + 2, b.y + 10, { px: 12, weight: 700, halo: false });
        text(g, V, 'Area inside the loop = work', b.x + 2, b.y + 27, { px: 11, color: c.ink2, halo: false });
        // grid
        g.lineWidth = V.px(1);
        for (let p = 0; p <= Pmax; p += Pmax > 50 ? 20 : 10) {
          line(g, V, x0, Y(p * 1e5), x0 + w, Y(p * 1e5), alpha(c.ink, 0.12), 1);
          text(g, V, String(p), x0 - 6, Y(p * 1e5) + 4, { px: 10.5, color: c.ink2, align: 'right', mono: true, halo: false });
        }
        line(g, V, x0, y0, x0, y0 + hh, c.ink, 1.5);
        line(g, V, x0, y0 + hh, x0 + w, y0 + hh, c.ink, 1.5);
        for (const cc of [0, 100, 200, 300, 400, 500]) {
          if (cc * 1e-6 > Vmax) continue;
          text(g, V, String(cc), X(cc * 1e-6), y0 + hh + 14, { px: 10.5, color: c.ink2, align: 'center', mono: true, halo: false });
        }
        text(g, V, 'volume, cm³', x0 + w, y0 + hh + 29, { px: 10.5, color: c.ink2, align: 'right', halo: false });
        // loop fills
        const P = res.P, Vv = res.V;
        const path = (i0, i1) => {
          g.beginPath();
          for (let i = i0; i <= i1; i++) {
            const x = X(Vv[i % res.N]), y = Y(P[i % res.N]);
            if (i === i0) g.moveTo(x, y); else g.lineTo(x, y);
          }
          g.closePath();
        };
        path(360, 1080); g.fillStyle = alpha(c.hot, 0.26); g.fill();
        path(1080, 1440 + 360); g.fillStyle = alpha(c.cold, 0.4); g.fill();
        // curve
        g.strokeStyle = c.ink; g.lineWidth = V.px(2); g.lineJoin = 'round';
        g.beginPath();
        for (let i = 0; i <= res.N; i++) {
          const x = X(Vv[i % res.N]), y = Y(P[i % res.N]);
          if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.stroke();
        // current point
        const cx = X(s.V), cy = Y(s.P);
        g.beginPath(); g.arc(cx, cy, V.px(6), 0, Math.PI * 2); g.fillStyle = c.accent; g.fill(); g.strokeStyle = c.ink; g.lineWidth = V.px(2); g.stroke();
      }

      // -------------------------------------------------------------- timeline
      function drawTimeline(g, V, c, s) {
        const b = L.tl;
        const X0 = b.x + 34, X1 = b.x + b.w - 6;
        const X = (phi) => X0 + (phi / 720) * (X1 - X0);
        const yP = b.y, hP = 56;
        const yS = yP + hP + 6, hS = 20;
        const yI = yS + hS + 8, yX = yI + 14, ySp = yX + 16, yA = ySp + 24;
        // pressure trace
        const pm = res.stats.pMaxBar * 1e5;
        g.strokeStyle = c.hot; g.lineWidth = V.px(1.8); g.lineJoin = 'round';
        g.beginPath();
        for (let i = 0; i <= res.N; i += 2) {
          const x = X(i * res.STEP), y = yP + hP - (res.P[i % res.N] / pm) * (hP - 6);
          if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.stroke();
        line(g, V, X0, yP + hP, X1, yP + hP, c.ink, 1);
        text(g, V, 'bar', b.x + 2, yP + 12, { px: 10.5, color: c.ink2, halo: false });
        text(g, V, fmt(res.stats.pMaxBar, 0), X(res.stats.phiPeak) + 6, yP + 10, { px: 10.5, color: c.hot, mono: true, weight: 700, halo: false });
        // strokes
        const tints = [c.cold, c.metal, c.hot, c.ink3];
        for (let i = 0; i < 4; i++) {
          g.fillStyle = alpha(tints[i], 0.3); g.fillRect(X(i * 180), yS, X(180) - X(0), hS);
          g.strokeStyle = c.ink; g.lineWidth = V.px(1.2); g.strokeRect(X(i * 180), yS, X(180) - X(0), hS);
          text(g, V, V.narrow || (X1 - X0) > 300 ? STROKE_NAMES[i] : STROKE_NAMES[i][0], (X(i * 180) + X((i + 1) * 180)) / 2, yS + 14, { px: 10.5, align: 'center', weight: 700, halo: false });
        }
        // valves
        const T = res.timing;
        const win = (open, close, y, col, label) => {
          text(g, V, label, b.x + 2, y + 9, { px: 10.5, color: c.ink2, mono: true, weight: 700, halo: false });
          const sp = E.mod(close - open, 720);
          g.fillStyle = alpha(col, 0.85);
          const a = open, e = open + sp;
          if (e <= 720) g.fillRect(X(a), y, X(e) - X(a), 10);
          else { g.fillRect(X(a), y, X(720) - X(a), 10); g.fillRect(X(0), y, X(e - 720) - X(0), 10); }
        };
        win(T.ivo, T.ivc, yI, c.cold, 'IN');
        win(T.evo, T.evc, yX, c.metalD, 'EX');
        // spark tick
        const phS = 360 - host.ctl.spark;
        text(g, V, 'SP', b.x + 2, ySp + 10, { px: 10.5, color: c.ink2, mono: true, weight: 700, halo: false });

        ],

        gs.push(A, B);

        let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
        gs.forEach((g) => {
          const r = g.N / 2 + 1.2;
          minx = Math.min(minx, g.x - r); maxx = Math.max(maxx, g.x + r);

        });
        const area = layout.gears;

        const ox = area.x + area.w / 2 - (unit * (minx + maxx)) / 2;

            const u = P.unit;
            g.save();
            g.translate(gr.X, gr.Y);
            g.rotate(gr.th);
            g.scale(u, u);
            g.beginPath();

            g.closePath();
            g.fillStyle = c.paper2; g.fill();
            g.fillStyle = fills[gr.role];
            g.fill();
            g.lineWidth = V.px(1.6) / u; g.strokeStyle = c.ink; g.lineJoin = 'round'; g.stroke();
            // lightening holes and hub
            const rr = gr.N / 2 - 1.25;
            g.lineWidth = V.px(1.2) / u;
            g.beginPath(); g.arc(0, 0, rr * 0.22, 0, Math.PI * 2); g.fillStyle = c.ink; g.fill();
            for (let k = 0; k < 5; k++) {
              const a = (k / 5) * Math.PI * 2;
              g.beginPath(); g.arc(Math.cos(a) * rr * 0.6, Math.sin(a) * rr * 0.6, rr * 0.16, 0, Math.PI * 2);

            g.beginPath(); g.moveTo(rr * 0.25, 0); g.lineTo(gr.N / 2 + 1, 0); g.stroke();
            g.restore();
            text(g, V, gr.id + ' · ' + gr.N + 'T', gr.X, gr.Y + gr.N / 2 * u + 1.2 * u + V.px(14), { px: 12, weight: 700, align: 'center', mono: true });
          });
          // pitch point highlights
          for (let i = 0; i + 1 < P.gs.length; i++) {

(function (root) {

        { label: 'Four ropes', text: 'A quarter of the force, four times the rope.', set: { n: 4, fric: 1, mass: 100 } },
        { label: 'Six ropes with friction', text: 'Each extra wheel adds a little friction.', set: { n: 6, fric: 0.95 } },

      ],
      quiz: [
        { q: 'You lift a 100 kg load with a frictionless block and tackle that has 4 supporting ropes. About how hard do you pull?', opts: ['981 N', '245 N', '490 N', '25 N'], a: 1, why: 'The weight is 100 × 9.81 = 981 N. Four ropes share it, so each carries about 245 N, and that is what you pull with.' },
        { q: 'The load rises 0.5 m with 4 supporting ropes. How much rope do you pull through your hands?', opts: ['0.5 m', '1 m', '2 m', '4 m'], a: 2, why: 'Each of the 4 supporting segments shortens by 0.5 m, so 4 × 0.5 = 2 m has to pass through your hands.' },
        { q: 'Why does a real six-pulley system need more than one sixth of the weight to lift it?', opts: ['Friction in each wheel takes a little of the tension', 'Gravity is stronger on long ropes', 'Six ropes cannot share a load equally', 'The rope gets heavier'], a: 0, why: 'Every wheel loses a few percent of the tension passing through it, and the losses add up across the system.' },

    const header = h('header', { class: 'site-header' },
      h('div', { class: 'header-in' },
        menuBtn,
        h('a', { class: 'brand', href: '#', 'aria-label': 'OmniMechanics, library' },
          h('@svg', { viewBox: '0 0 32 32', width: 26, height: 26, 'aria-hidden': 'true', class: 'brand-mark' },
            h('@circle', { cx: 16, cy: 16, r: 9.5, fill: 'none', stroke: 'currentColor', 'stroke-width': 2.4 }),
            h('@circle', { cx: 16, cy: 16, r: 3, fill: 'currentColor' }),
            h('@path', { d: 'M16 2v5M16 25v5M2 16h5M25 16h5M6.1 6.1l3.5 3.5M22.4 22.4l3.5 3.5M6.1 25.9l3.5-3.5M22.4 9.6l3.5-3.5', stroke: 'currentColor', 'stroke-width': 2.6, fill: 'none' })),
          h('span', { class: 'brand-name' }, 'Omni', h('b', { text: 'Mechanics' }))),
        h('nav', { class: 'top-nav', 'aria-label': 'Site' },
          h('a', { href: '#', id: 'nav-library', text: 'Library' }),
          h('a', { href: '#about', id: 'nav-about', text: 'About' })),
        themeBtn));

    railEl = h('nav', { class: 'rail', id: 'rail', 'aria-label': 'Mechanisms' });
    OM.groups.forEach((g) => {
      const list = OM.mods.filter((m) => m.group === g.id);
      if (!list.length) return;
      railEl.appendChild(h('div', { class: 'rail-group' },
        h('h2', { class: 'rail-h', text: g.name }),
        h('ul', null, list.map((m) => h('li', null,
          h('a', { href: '#' + m.id, dataset: { id: m.id }, on: { click: () => toggleRail(false) } },
            h('span', { class: 'rail-no', text: m.number.replace('OM-', '') }),
            h('span', { class: 'rail-t', text: m.title }),
            h('span', { class: 'rail-ck', 'aria-hidden': 'true' })))))));
    });
    backdrop = h('div', { class: 'rail-backdrop', hidden: true, on: { click: () => toggleRail(false) } });
    mainEl = h('main', { class: 'main', id: 'main', tabindex: '-1' });
    const footer = h('footer', { class: 'site-footer' },
      h('p', null, 'OmniMechanics 2.0. Runs offline, keeps nothing but your quiz progress and theme on this device.'),
      h('p', null, 'Type: Archivo (SIL Open Font License).'));

    const skip = h('a', { class: 'skip', href: '#main', text: 'Skip to content' });
    skip.addEventListener('click', (ev) => { ev.preventDefault(); mainEl.focus(); });

    clear(app).append(skip, header, h('div', { class: 'layout' }, railEl, h('div', { class: 'content' }, mainEl, footer)), backdrop);
    document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && railEl.classList.contains('open')) { toggleRail(false); menuBtn.focus(); } });
  }

  function toggleRail(open) {
    if (open == null) open = !railEl.classList.contains('open');
    railEl.classList.toggle('open', open);
    backdrop.hidden = !open;
    menuBtn.setAttribute('aria-expanded', String(open));
    document.body.classList.toggle('no-scroll', open && matchMedia('(max-width: 1179px)').matches);
    if (open) { const a = railEl.querySelector('a[aria-current="page"]') || railEl.querySelector('a'); if (a) a.focus(); }
  }

  function updateRailChecks() {
    if (!railEl) return;
    railEl.querySelectorAll('a[data-id]').forEach((a) => a.classList.toggle('done', isDone(a.dataset.id)));
  }
  function markActive(id, page) {
    railEl.querySelectorAll('a[data-id]').forEach((a) => {
      if (a.dataset.id === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    ['library', 'about'].forEach((n) => {
      const a = document.getElementById('nav-' + n);
      if (a) { if (page === n) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }
    });
  }

  // ---------------------------------------------------------------- views
  function leave() {
    cleanup.forEach((f) => { try { f(); } catch (e) { console.error(e); } });
    cleanup = [];
    if (current) { current.destroy(); current = null; }
    OM.debug.stage = null;
  }

  function viewHome() {
    document.title = 'OmniMechanics: how things really work';
    markActive(null, 'library');
    const filters = [{ id: 'all', name: 'Everything' }].concat(OM.groups.map((g) => ({ id: g.id, name: g.name })));
    let group = 'all';
    let query = '';

    const heroCanvas = h('canvas', { class: 'hero-canvas', 'aria-hidden': 'true' });
    const grid = h('div', { class: 'lib' });
    const empty = h('p', { class: 'empty', hidden: true, text: 'Nothing matches that search. Try a word like "motor", "orbit" or "lock".' });
    const search = h('input', { type: 'search', id: 'lib-search', class: 'search', placeholder: 'Search mechanisms', 'aria-label': 'Search mechanisms', autocomplete: 'off' });
    const chipBtns = filters.map((f) => h('button', { type: 'button', class: 'chip', 'aria-pressed': String(f.id === 'all'), dataset: { g: f.id }, text: f.name }));
    const count = h('span', { class: 'lib-count' });

    const node = h('div', { class: 'view view-home' },
      h('section', { class: 'hero' },
        h('div', { class: 'hero-copy' },
          h('p', { class: 'eyebrow', text: 'Interactive drawings' }),
          h('h1', { id: 'page-h', tabindex: '-1' }, 'How things ', h('span', { class: 'mark', text: 'really' }), ' work.'),
          h('p', { class: 'hero-sub', text: 'Thirteen machines, circuits and systems you can poke. Each one runs on the equations engineers use, with the numbers beside the picture, and each one says what it leaves out.' })),
        h('div', { class: 'hero-art' }, heroCanvas)),
      h('section', { class: 'lib-tools', 'aria-label': 'Filter the library' },
        h('div', { class: 'chips', role: 'group', 'aria-label': 'Topic' }, chipBtns),
        h('div', { class: 'lib-search-wrap' }, search, count)),
      grid, empty);

    const cards = OM.mods.map((m) => {
      const cv = h('canvas', { class: 'thumb', 'aria-hidden': 'true' });
      const el = h('a', { class: 'card', href: '#' + m.id, dataset: { id: m.id, g: m.group, q: (m.title + ' ' + m.hook).toLowerCase() } },
        h('div', { class: 'thumb-wrap' }, cv),
        h('div', { class: 'card-body' },
          h('div', { class: 'card-top' },
            h('span', { class: 'card-no', text: m.number }),
            h('span', { class: 'card-done', text: 'Quiz done', hidden: !isDone(m.id) })),
          h('h3', { text: m.title }),
          h('p', { text: m.hook })));
      return { m, el, cv };
    });

    function paintGrid() {
      clear(grid);
      let shown = 0;
      OM.groups.forEach((g) => {
        const items = cards.filter((c) => c.m.group === g.id && (group === 'all' || group === g.id) && (!query || c.el.dataset.q.indexOf(query) >= 0));
        if (!items.length) return;
        shown += items.length;
        grid.appendChild(h('section', { class: 'lib-group' },
          h('div', { class: 'lib-group-h' }, h('h2', { text: g.name }), h('p', { text: g.blurb })),
          h('div', { class: 'cards' }, items.map((c) => c.el))));
      });
      empty.hidden = shown > 0;
      count.textContent = shown + (shown === 1 ? ' mechanism' : ' mechanisms');
    }
    chipBtns.forEach((b) => b.addEventListener('click', () => {
      group = b.dataset.g;
      chipBtns.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      paintGrid();
    }));
    search.addEventListener('input', () => { query = search.value.trim().toLowerCase(); paintGrid(); });
    paintGrid();

    // Thumbnails are real drawings from the simulations, painted a few at a time.
    let cancelled = false;
    function paintThumbs() {
      cards.forEach((c, i) => {
        setTimeout(() => {
          if (cancelled) return;
          try {
            const w = c.cv.parentElement.clientWidth || 320;
            OM.renderThumb(c.m, c.cv, w, Math.round(w * 0.625));
          } catch (e) { console.error('Thumbnail failed for ' + c.m.id + ':', e); }
        }, 20 + i * 25);
      });
    }
    requestAnimationFrame(paintThumbs);
    cleanup.push(() => { cancelled = true; });
    cleanup.push(OM.theme.onChange(() => paintThumbs()));
    cleanup.push(heroGears(heroCanvas));
    return node;
  }

  // Two meshing involute gears: the app's own theme in motion.
  function heroGears(canvas) {
    const G = OM.gears;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const g = canvas.getContext('2d');
    let raf = 0;
    let t0 = 0;
    let visible = true;
    let dead = false;
    const NA = 14, NB = 22, NC = 12;
    function size() {
      const w = canvas.clientWidth || 360;
      const hgt = Math.round(w * 0.72);
      const dpr = Math.min(2, devicePixelRatio || 1);
      canvas.width = w * dpr; canvas.height = hgt * dpr; canvas.style.height = hgt + 'px';
      return { w, hgt, dpr };
    }
    let S = size();
    function drawGear(N, cx, cy, ang, unit, fill, stroke, mark) {
      const o = G.outline(N).pts;
      const c = Math.cos(ang), s = Math.sin(ang);
      g.beginPath();
      o.forEach(([x, y], i) => {
        const X = cx + (x * c - y * s) * unit, Y = cy + (x * s + y * c) * unit;
        if (i) g.lineTo(X, Y); else g.moveTo(X, Y);
      });
      g.closePath();
      g.fillStyle = fill; g.fill();
      g.lineWidth = 1.6; g.strokeStyle = stroke; g.lineJoin = 'round'; g.stroke();
      // spokes
      const r = (N / 2 - 1.25) * unit;
      g.beginPath(); g.arc(cx, cy, r * 0.62, 0, Math.PI * 2); g.strokeStyle = stroke; g.lineWidth = 1.2; g.stroke();
      g.beginPath(); g.arc(cx, cy, r * 0.16, 0, Math.PI * 2); g.fillStyle = stroke; g.fill();
      g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(ang) * r * 0.62, cy + Math.sin(ang) * r * 0.62); g.strokeStyle = mark; g.lineWidth = 3; g.stroke();
    }
    function frame(t) {
      raf = 0;
      if (dead) return;
      const c = OM.theme.c;
      const time = reduce ? 0.6 : (t - t0) / 1000;
      g.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
      g.clearRect(0, 0, S.w, S.hgt);
      const unit = Math.min(S.w / (NA / 2 + NB + NC / 2 + 4), S.hgt / 30);
      // A drives B; C is on B's shaft and drives nothing (a compound pair for looks).
      const ax = S.w * 0.24, ay = S.hgt * 0.62;
      const dAB = ((NA + NB) / 2) * unit;
      const alpha = -0.42;
      const bx = ax + Math.cos(alpha) * dAB, by = ay + Math.sin(alpha) * dAB;
      const thA = time * 0.9;
      const thB = G.meshAngle(thA, alpha, NA, NB);
      const alpha2 = -0.2;
      const dBC = ((NB + NC) / 2) * unit;
      const cx = bx + Math.cos(alpha2) * dBC, cy = by + Math.sin(alpha2) * dBC;
      const thC = G.meshAngle(thB, alpha2, NB, NC);
      drawGear(NB, bx, by, thB, unit, OM.gfx.alpha(c.accent, 0.55), c.ink, c.ink);
      drawGear(NA, ax, ay, thA, unit, c.paper2, c.ink, c.hot);
      drawGear(NC, cx, cy, thC, unit, c.paper2, c.ink, c.cold);
      if (!reduce && visible) raf = requestAnimationFrame(frame);
    }
    const ro = typeof ResizeObserver === 'function' ? new ResizeObserver(() => { S = size(); frame(performance.now()); }) : null;
    if (ro) ro.observe(canvas);
    const io = typeof IntersectionObserver === 'function' ? new IntersectionObserver((es) => {
      visible = es[es.length - 1].isIntersecting;
      if (visible && !raf && !dead && !reduce) { t0 = t0 || performance.now(); raf = requestAnimationFrame(frame); }
    }) : null;
    if (io) io.observe(canvas);
    t0 = performance.now();
    raf = requestAnimationFrame(frame);
    const off = OM.theme.onChange(() => frame(performance.now()));
    return () => { dead = true; cancelAnimationFrame(raf); if (ro) ro.disconnect(); if (io) io.disconnect(); off(); };
  }

  function section(id, title, kids) {
    return h('section', { class: 'notes-sec', 'aria-labelledby': id }, h('h2', { id, text: title }), kids);
  }

  function viewMech(def) {
    document.title = def.title + ' · OmniMechanics';
    markActive(def.id);
    const ct = def.content;
    const stepEls = ct.steps.map((s, i) => h('li', { class: 'step', dataset: { i } },
      h('h3', null, h('span', { class: 'step-t', text: s.h })),
      h('p', null, rich(s.p))));
    let stage = null;

    // Try this
    const tryBtns = (ct.tries || []).map((t) => {
      const b = h('button', { type: 'button', class: 'try', 'aria-pressed': 'false' },
        h('span', { class: 'try-l', text: t.label }),
        t.text ? h('span', { class: 'try-t', text: t.text }) : null);
      b.addEventListener('click', () => {
        stage.applyPreset(t);
        tryBtns.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      });
      return b;
    });

    stage = OM.createStage(def, {
      onPhase(i) { stepEls.forEach((el, k) => { el.classList.toggle('is-now', k === i); if (k === i) el.setAttribute('aria-current', 'step'); else el.removeAttribute('aria-current'); }); },
      onControl(_id, _v, user) { if (user) tryBtns.forEach((x) => x.setAttribute('aria-pressed', 'false')); },
    });
    current = stage;
    OM.debug.stage = stage;

    // Principle
    const p = ct.principle;
    const principle = section('h-principle', 'The principle', [
      p.lead ? h('p', { class: 'lead' }, rich(p.lead)) : null,
      (p.eqs || []).map((e) => h('figure', { class: 'eq' },
        h('figcaption', { text: e.label }),
        h('div', { class: 'eq-line' }, rich(e.eq)),
        e.note ? h('p', { class: 'eq-note' }, rich(e.note)) : null)),
      p.points ? h('ul', { class: 'points' }, p.points.map((x) => h('li', null, rich(x)))) : null,
    ]);

    // Myth
    const myth = h('aside', { class: 'myth', 'aria-labelledby': 'h-myth' },
      h('h2', { id: 'h-myth', class: 'tag', text: ct.myth.title || 'Common myth' }),
      h('p', { class: 'claim' }, rich(ct.myth.claim)),
      h('p', { class: 'tag tag-true', text: 'What actually happens' }),
      h('p', null, rich(ct.myth.truth)));

    // Quiz
    const quiz = buildQuiz(def);

    // Sources
    const sources = ct.sources && ct.sources.length
      ? section('h-src', 'Sources and further reading', h('ul', { class: 'sources' }, ct.sources.map((s) => h('li', null, rich(s)))))
      : null;

    // Prev / next
    const i = def.order;
    const prev = OM.mods[i - 1], next = OM.mods[i + 1];
    const pn = h('nav', { class: 'prevnext', 'aria-label': 'More mechanisms' },
      prev ? h('a', { href: '#' + prev.id, class: 'pn pn-prev' }, h('span', { class: 'pn-k', text: 'Previous' }), h('span', { class: 'pn-t', text: prev.title })) : h('span'),
      next ? h('a', { href: '#' + next.id, class: 'pn pn-next' }, h('span', { class: 'pn-k', text: 'Next' }), h('span', { class: 'pn-t', text: next.title })) : h('span'));

    const grp = OM.groups.find((g) => g.id === def.group);
    const node = h('div', { class: 'view view-mech' },
      h('header', { class: 'mech-head' },
        h('p', { class: 'eyebrow' }, def.number, ' · ', grp.name),
        h('h1', { id: 'page-h', tabindex: '-1', text: def.title }),
        h('p', { class: 'mech-hook' }, rich(ct.intro || def.hook))),
      h('div', { class: 'mech-grid' },
        h('div', { class: 'mech-stage' }, stage.sheet, stage.controlsEl),
        h('div', { class: 'mech-notes' },
          section('h-steps', 'What you are seeing', h('ol', { class: 'steps' }, stepEls)),
          principle,
          myth,
          tryBtns.length ? section('h-try', 'Try this', h('div', { class: 'tries' }, tryBtns)) : null,
          quiz,
          sources)),
      pn);
    return node;
  }

  function buildQuiz(def) {
    const qs = def.content.quiz;
    let correctFirst = 0;
    const answered = new Array(qs.length).fill(false);
    const attempts = new Array(qs.length).fill(0);
    const status = h('p', { class: 'quiz-status', 'aria-live': 'polite' });
    function refreshStatus() {
      const n = answered.filter(Boolean).length;
      status.textContent = n === qs.length
        ? 'All done. ' + correctFirst + ' of ' + qs.length + ' right on the first try.'
        : n + ' of ' + qs.length + ' answered';
    }
    const items = qs.map((q, qi) => {
      const fb = h('div', { class: 'quiz-fb', hidden: true });
      const opts = q.opts.map((o, oi) => h('button', { type: 'button', class: 'opt', dataset: { i: oi } },
        h('span', { class: 'opt-k', text: String.fromCharCode(65 + oi) }), h('span', { class: 'opt-t' }, rich(o))));
      opts.forEach((b, oi) => b.addEventListener('click', () => {
        if (answered[qi]) return;
        attempts[qi]++;
        const ok = oi === q.a;
        b.classList.add(ok ? 'right' : 'wrong');
        b.setAttribute('aria-pressed', 'true');
        clear(fb);
        if (ok) {
          answered[qi] = true;
          if (attempts[qi] === 1) correctFirst++;
          opts.forEach((x) => { x.disabled = true; });
          fb.append(h('p', { class: 'fb-ok' }, h('strong', { text: 'Right. ' }), rich(q.why)));
        } else {
          b.disabled = true;
          fb.append(h('p', { class: 'fb-no' }, h('strong', { text: 'Not quite. ' }), 'Have another go.'));
        }
        fb.hidden = false;
        refreshStatus();
        if (answered.every(Boolean)) markDone(def.id, correctFirst, qs.length);
      }));
      return h('fieldset', { class: 'q' },
        h('legend', null, h('span', { class: 'q-n', text: String(qi + 1) }), rich(q.q)),
        h('div', { class: 'opts' }, opts), fb);
    });
    refreshStatus();
    return section('h-quiz', 'Quick check', [items, status]);
  }

  function viewAbout() {
    document.title = 'About · OmniMechanics';
    markActive(null, 'about');
    const swatch = (color, label, what) => h('li', null, h('span', { class: 'sw', style: { background: 'var(' + color + ')' } }), h('span', null, h('strong', { text: label + ' ' }), what));
    return h('div', { class: 'view view-about' },
      h('header', { class: 'mech-head' },
        h('p', { class: 'eyebrow', text: 'About' }),
        h('h1', { id: 'page-h', tabindex: '-1', text: 'Machines you can poke at' }),
        h('p', { class: 'mech-hook', text: 'OmniMechanics is a library of live drawings. Every one is a working simulation, and every one puts numbers next to the picture so you can see cause and effect.' })),
      h('div', { class: 'about-grid' },
        section('a-trust', 'How far can you trust the numbers?', [
          h('p', null, rich('Each model is written from the equations engineers actually use, then checked by automated tests against known results. The engine is compared with typical figures for a small petrol engine. Orbits are checked against Kepler\'s law and conservation of energy. The wing\'s lift is calculated two independent ways and the answers must agree. The logic adder is tested on every possible input.')),
          h('p', null, rich('The models are simplified on purpose, and every page lists what it leaves out. Treat the values as realistic teaching numbers. They are not design data for building anything real.'))]),
        section('a-read', 'Reading the drawings', [
          h('ul', { class: 'legend' },
            swatch('--c-hot', 'Orange.', 'Heat, force and pressure: the things doing the pushing.'),
            swatch('--c-cold', 'Blue.', 'Cold, air and water, the stuff being pushed or cooled.'),
            swatch('--c-elec', 'Teal.', 'Electricity: current, voltage and signals.'),
            swatch('--c-metal', 'Grey.', 'Solid parts. Diagonal hatching marks metal that has been cut through, as in a workshop manual.'),
            swatch('--accent', 'Yellow.', 'Whatever you are meant to look at right now.')),
          h('p', null, 'Colour is never the only clue. Labels and numbers say the same thing.')]),
        section('a-use', 'Using it', [
          h('ul', { class: 'points' },
            h('li', null, rich('Every animation has **Play/Pause**, **Step** and a speed control. If your device asks for reduced motion, animations start paused.')),
            h('li', null, rich('Sliders work with the arrow keys. Diagrams you can drag also respond to the arrow keys when focused.')),
            h('li', null, rich('The **quick check** at the bottom of each page remembers what you have finished on this device only.')),
            h('li', null, 'The whole thing is one file. It works offline and sends nothing anywhere.'))]),
        section('a-credit', 'Credits', [
          h('p', null, rich('Type is Archivo by Omnibus-Type, under the SIL Open Font License 1.1. Numbers for R-134a are fitted to standard refrigerant tables. Each mechanism page lists the textbooks its equations come from.'))])));
  }

  function viewMissing(id) {
    document.title = 'Not found · OmniMechanics';
    markActive(null, null);
    return h('div', { class: 'view' },
      h('header', { class: 'mech-head' },
        h('p', { class: 'eyebrow', text: 'Not found' }),
        h('h1', { id: 'page-h', tabindex: '-1', text: 'That drawing is not in the library' }),
        h('p', { class: 'mech-hook' }, 'There is no mechanism called "' + id + '". ', h('a', { href: '#', text: 'Go back to the library' }), '.')));
  }

  // ---------------------------------------------------------------- router
  function route() {
    const raw = decodeURIComponent((location.hash || '').replace(/^#\/?/, ''));
    leave();
    let node;
    if (!raw || raw === 'main') node = viewHome();
    else if (raw === 'about') node = viewAbout();
    else {
      const def = OM.getMod(raw);
      node = def ? viewMech(def) : viewMissing(raw);
    }
    clear(mainEl).appendChild(node);
    updateRailChecks();
    if (!firstRoute) {
      window.scrollTo(0, 0);
      const hd = document.getElementById('page-h');
      if (hd) hd.focus({ preventScroll: true });
    }
    firstRoute = false;
  }

  function start() {
    OM.theme.refresh();
    const app = document.getElementById('app');
    buildShell(app);
    OM.theme.refresh();
    window.addEventListener('hashchange', route);
    route();
  }

  OM.debug = { stage: null };
  OM.ui = { start, route };
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ---- main.js ---- */
(function () {
  'use strict';
  function boot() {
    if (!OM.mods.length) throw new Error('No mechanisms registered');
    OM.ui.start();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
