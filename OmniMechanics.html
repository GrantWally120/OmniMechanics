alls, and slows underneath, where it rises. Both descriptions are the same thing seen two ways.",steps:[{h:"The air splits at the nose",p:"Some air goes over the wing and some under. The point where it divides is the stagnation point. Tilt the wing up and it slides down to the underside."},{h:"The top is faster",p:"Air is pulled round the curved top surface, so it speeds up there. Fast air has lower pressure (Bernoulli). The blue on the top surface is that suction."},{h:"The flow leaves smoothly",p:"At the sharp trailing edge the air cannot turn the corner, so it leaves along the wing. That rule (the Kutta condition) fixes how much the air circulates around the wing, and therefore the lift."},{h:"Too steep and it stalls",p:"Past about 15\xB0 the air can no longer follow the top surface. It breaks away into a turbulent wake, the suction collapses and the lift drops. Try 20\xB0."}],principle:{lead:"Lift is pressure acting on the wing\u2019s surface. The pressure map in the picture is computed from the flow speed at every point, and adding it up around the wing gives the lift.",eqs:[{label:"Lift force",eq:"L = \xBD \u03C1 V\xB2 S C~L~",note:"\u03C1 = 1.225 kg/m\xB3 is air density at sea level, V the airspeed, S the wing area."},{label:"Thin-wing result",eq:"C~L~ \u2248 2\u03C0 (\u03B1 \u2212 \u03B1~0~)",note:"\u03B1 is the angle of attack in radians. That is about 0.11 per degree. A cambered wing has a negative zero-lift angle \u03B1~0~."},{label:"Kutta\u2013Joukowski",eq:"L\u2032 = \u03C1 V \u0393",note:"Lift per metre of span equals density, speed and the circulation \u0393 around the wing."},{label:"Bernoulli",eq:"p + \xBD \u03C1 v\xB2 = constant",note:"Along a streamline, faster air means lower pressure."}],points:["The flow here is the exact mathematical solution for a Joukowski wing section (a circle transformed by z = \u03B6 + 1/\u03B6). The lift from the pressure map and from the circulation agree to within 2 percent, and the tests check that.","**What this model leaves out:** viscosity. It cannot show drag or the boundary layer. The stall curve is a typical shape added by hand, and the turbulence past the stall is illustrative, not calculated."]},myth:{title:"Common myth: equal transit time",claim:"The air over the top has further to go, so it must travel faster to meet up with the air from underneath at the back.",truth:"There is no rule that the two bits of air must meet up again. Switch on the race: the air over the top gets to the back well ahead of the air below. The flow is faster over the top because of the circulation the sharp trailing edge demands, not because it is catching up."},tries:[{label:"Cruising, 5\xB0",text:"A typical angle in steady flight.",set:{aoa:5,shape:"cam",speed:50,area:16,race:!1}},{label:"Zero angle",text:"The symmetric section makes no lift. The cambered one still does.",set:{aoa:0}},{label:"Stall",text:"Beyond 15\xB0 the lift drops and the air breaks away.",set:{aoa:19,shape:"cam"}},{label:"Race the air",text:"Which particle reaches the trailing edge first?",set:{aoa:5,race:!0}},{label:"Slow for landing",text:"At 28 m/s, even right at the stall angle this wing makes only about 70 percent of its cruise lift. Landing planes use flaps to get more.",set:{speed:28,aoa:15,race:!1}}],quiz:[{q:"Which description of how a wing makes lift is correct?",opts:["The air over the top must go faster to meet the air from underneath","The wing turns the airflow downwards, pressure is lower above and higher below, and the air pushes the wing up in return","The wing is sucked up into a vacuum above it","Air hits the underside like a skipping stone and nothing else matters"],a:1,why:"Pushing air down, lower pressure above and higher pressure below, and the circulation around the wing are all the same physics described from different angles. The equal-transit-time story is the one that is wrong."},{q:"Two air particles split at the nose of the wing. Which one reaches the trailing edge first in this simulation?",opts:["The one underneath","They arrive together","The one over the top","It depends on the colour"],a:2,why:"The air over the top moves faster and arrives well ahead. Nothing forces the two to meet again."},{q:"What happens to the lift when the angle of attack is raised well beyond about 15\xB0?",opts:["It keeps growing in a straight line","The air separates from the top surface and the lift drops: a stall","It becomes zero exactly","The wing gets thicker"],a:1,why:"The smooth flow round the top breaks down, the suction collapses and the lift falls. It is why pilots lower the nose to recover."}],era:"Kutta, 1902",level:5,parts:[{name:"Leading edge",note:"The rounded front, where the air meets the wing."},{name:"Trailing edge",note:"The sharp back edge. The air has to leave it smoothly."},{name:"Upper surface",note:"Where the air is fastest and the pressure lowest."},{name:"Chord",note:"The straight line from the leading edge to the trailing edge."},{name:"Angle of attack",note:"The angle between the chord and the oncoming air."}],facts:["Martin Kutta saw in 1902 that air leaves a wing smoothly at its sharp trailing edge. Nikolai Joukowski gave the exact link between circulation and lift in 1906.","A wing stalls when the air can no longer follow the top surface, at around 15 degrees of angle of attack for a typical wing. The model here does the same.","The air over the top of a wing gets to the back first, not at the same time as the air underneath. The equal transit time story is wrong, and the pressure map shows what really happens."],sources:["J. D. Anderson Jr., *Fundamentals of Aerodynamics*, McGraw-Hill (potential flow, the Kutta condition, thin airfoil theory).","I. H. Abbott and A. E. von Doenhoff, *Theory of Wing Sections*, Dover (1959)."]},create(W){const f={key:"",af:null,field:null,fieldKey:"",tr:null,raceData:null,raceKey:"",raceT:0,hold:0,rand:R(7),peak:1};let m=null;const b=()=>W.ctl.aoa;function S(){const c=X[W.ctl.shape],s=W.ctl.aoa+"|"+W.ctl.shap es add up",p:"Where two sound waves meet, their pressures add. A crest meeting a crest makes a louder sound. A crest meeting a trough makes them cancel."},{h:"Play the mirror image",p:"A wave shifted by half a cycle (180\xB0) is the exact opposite of the original. Add the two together and, at every moment, the result is zero."},{h:"The clock is ticking",p:"The microphone, chip and speaker take a few tens of microseconds. By the time the anti-noise arrives, the noise has moved on, so the mirror image is slightly off."},{h:"Low pitches win",p:"A fixed delay is a small slice of a long wave and a big slice of a short one. 60 \xB5s is 2 percent of a 300 Hz cycle but 36 percent of a 6 kHz cycle, so high pitches cannot be cancelled this way."}],principle:{lead:"Cancelling is a sum of two waves of the same pitch. The size of what is left depends only on how well the anti-noise matches in loudness and timing.",eqs:[{label:"What is left",eq:"residual = | 1 + a e^{i\u03C6} |",note:"a is the anti-noise loudness compared with the noise, \u03C6 its timing shift. Perfect is a = 1 and \u03C6 = 180\xB0."},{label:"With a delay \u03C4",eq:"residual = 2 sin(\u03C0 f \u03C4)",note:"An exact mirror image made \u03C4 seconds late. Small for low f, and more than 1 (louder) above f = 1 \xF7 (6\u03C4)."},{label:"In decibels",eq:"reduction = \u221220 log\u2081\u2080(residual)",note:"10 dB is roughly half as loud to your ear. 20 dB is a tenth of the pressure."}],points:["That is why headphones tackle steady low rumble, like a jet engine or a bus, and do little for voices, hiss or a sudden clatter. Soft ear cushions block the high pitches the electronics cannot.","Real headphones have one microphone outside and often one inside the cup, and the electronics adapt continuously to the exact delay of your head and the cup.","**What this model leaves out:** adaptive filtering, the speaker\u2019s own response and the position of your head. It shows one steady pitch, where real noise is a mix of many. ",title:"Orbits and Newton\u2019s cannon",group:"signals",hook:"A satellite is not floating. It is falling, and moving sideways so fast that it keeps missing the ground.",units:"km, km/s, min, m/s\xB2",alt:"Earth seen from above the pole with a cannon on a tower firing sideways. The shot follows a path that falls back, circles the Earth, swings out in an ellipse or escapes, depending on its speed. A chart shows circular orbit period against altitude.",controls:[{id:"speed",type:"range",label:"Launch speed (sideways)",min:0,max:12,step:.05,value:7.67,dec:2,unit:"km/s",hint:"Orbit speed at 400 km is 7.67 km/s, about 27,600 km/h."},{id:"alt",type:"range",label:"Launch height",min:0,max:2e3,step:50,value:400,unit:"km"},{id:"angle",type:"range",label:"Launch direction above level",min:-10,max:60,step:1,value:0,unit:"\xB0"},{id:"warp",type:"seg",label:"Time",value:400,options:[{v:150,l:"Slow"},{v:400,l:"Normal"},{v:1500,l:"Fast"}]},{id:"zoom",type:"seg",label:"View",value:"near",options:[{v:"near",l:"Near"},{v:"far",l:"Far out"}]},{id:"fire",type:"button",label:"Fire again",primary:!0,playOnClick:!0}],content:{intro:"Newton imagined a cannon on a very tall mountain. Fire it sideways and the ball curves down to the ground. Fire it faster and it lands farther away. Fire it fast enough and the ground curves away as quickly as the ball falls, so it never lands.",steps:[{h:"Everything falls",p:"Gravity pulls the ball towards the centre of the Earth all the time. A ball fired sideways falls just as fast as one dropped, it simply lands farther off."},{h:"The ground curves away",p:"The Earth is round. The faster the ball travels, the more the surface curves away underneath it before it can land."},{h:"Fast enough and it never lands",p:"At about 7.9 km/s at ground level (7.67 at 400 km up) the ground drops away as fast as the ball falls. The ball is in a circular orbit: always falling, always missing."},{h:"Faster still",p:"Go above circular speed and the path becomes an ellipse t w gently: the lift is the same, but the speed and acceleration along the way are not."},{h:"Held at the top",p:"A short flat stretch at the largest radius keeps the follower at full lift. In an engine this is where the valve stays open."},{h:"The spring brings it back",p:"The cam cannot pull. The spring pushes the follower down as the lobe leaves, and it has to push hard enough to keep the roller against the edge the whole way."}],principle:{lead:"Every point on the cam edge is a position, and the speed of the shaft turns that position list into a schedule. Faster shaft, bigger forces: the acceleration grows with the square of the speed.",eqs:[{label:"Cycloidal rise",eq:"y = h ( s \u2212 sin 2\u03C0s / 2\u03C0 ), s = \u03B8 / \u03B2",note:"h is the lift and \u03B2 the angle of the rise. The harmonic law is y = h (1 \u2212 cos \u03C0s) / 2."},{label:"Peak acceleration",eq:"a~max~ = C h \u03C9^2^ / \u03B2^2^",note:"C is 4.0 for constant acceleration, 4.93 for harmonic and 6.28 for cycloidal. Double the speed and the acceleration is four times bigger."},{label:"Force between cam and follower",eq:"N = m a + F~0~ + k y + m g",note:"The spring supplies F\u2080 + k y. If that falls below what is needed to decelerate the follower, N would have to be negative."},{label:"Pressure angle",eq:"tan \u03C6 = (dy/d\u03B8) / (R~b~ + R~r~ + y)",note:"The angle between the push and the direction the follower can move. Above about 30\xB0 the guide takes a big sideways load."}],points:["The cam can push but not pull, so N can never be negative. When the equation says it must be, the follower leaves the cam. This is **valve float**, and the simulation shows the follower flying off and landing again.","A small base circle with a tall, quick lobe gives a steep edge: a high pressure angle and, in the extreme, a cam that cannot be cut because the roller is wider than the tip of the lobe (undercut).","**What this model leaves out:** the springiness of the follower and its rod (real ones vibra ed by a pendulum. In return the wheel gives the pendulum a small push on every swing, so the swing never dies out.",steps:[{h:"Locked",p:"One pallet holds a tooth of the escape wheel. The wheel is pulled on by the weight but cannot move, and the pendulum swings freely with nothing but gravity acting on it."},{h:"Released",p:"As the pendulum passes the middle of its swing, the pallet slides off the end of its locking face and the wheel is free to turn."},{h:"Impulse",p:"The tooth slides down the slanted impulse face. The wheel moves on, and the pallet is pushed the same way the pendulum is already going. That push is the energy that keeps the clock running."},{h:"Caught",p:"The other pallet has swung into the wheel. The next tooth drops onto it and stops dead. That drop is the tick, and one full swing has two ticks."}],principle:{lead:"The pendulum is the timekeeper. The escapement is only a gate that counts its swings and tops up its energy. The period depends on the length and on gravity, and on almost nothing else.",eqs:[{label:"Period for a small swing",eq:"T~0~ = 2\u03C0 \u221A(L / g)",note:"L is the distance from the pivot to the centre of the bob. The mass does not appear. A pendulum 0.994 m long on Earth has T = 2 s, one tick a second."},{label:"Period for any swing",eq:"T = T~0~ / AGM(1, cos(A/2))",note:"A is the amplitude, and AGM is the arithmetic-geometric mean. For small swings this is T\u2080 (1 + A\xB2/16): a wider swing is a slower swing."},{label:"Energy balance",eq:"energy pushed in per swing = energy lost per swing",note:"The bars in the drawing are that balance. The swing grows or shrinks until the two are equal."},{label:"The wheel",eq:"the wheel turns once every N \xD7 T",note:"The wheel moves on one tooth for each full swing (two ticks). With N = 30 teeth and T = 2 s, that is 60 seconds, so a seconds hand can sit on its shaft."}],points:["The locking faces are arcs centred on the anchor pivot. The locked wheel therefore pushes straight at the pivot and gives no push and no recoil. This is the Graham dead-beat escapement. The slanted impulse faces in the picture are worked out from the path the tooth tip takes across the anchor.","Accuracy depends on the swing. A bigger swing is slightly slower, so a clock whose swing changes (a tired spring, thicker oil) changes its rate. Between 3\xB0 and 4\xB0 the difference is about 11 seconds a day.","**What this model leaves out:** the rod and bob are treated as a single point mass, and there is no temperature expansion, suspension spring, friction at the pallets, or bounce when the wheel drops. The drag is exaggerated so that the swing settles in under a minute. A real clock is many times less damped and takes much longer to settle."]},myth:{claim:"A heavier pendulum swings more slowly.",truth:"The period does not depend on the mass at all. Gravity pulls harder on a heavy bob, but it is harder to move, and the two cancel exactly. Try it with the mass slider. A heavy bob does help a real clock in another way: it stores more energy, so the small pushes and puffs of air disturb it less."},tries:[{label:"Seconds pendulum",text:"About one metre gives a two-second swing and one tick a second.",set:{len:.995,where:"earth",mass:2,drive:45}},{label:"Short and quick",text:"A quarter of the length gives half the period.",set:{len:.25,where:"earth",drive:45}},{label:"On the Moon",text:"With a sixth of the gravity the same pendulum takes about 2.5 times as long.",set:{len:.995,where:"moon",drive:45}},{label:"Heaviest bob",text:"Ten kilograms instead of two, and the period does not move.",set:{len:.995,where:"earth",mass:10,drive:45}},{label:"Wide swing",text:"Full drive: a bigger swing, and a clock that loses minutes a day.",set:{len:.995,where:"earth",drive:100}},{label:"Let it run down",text:"With no drive the swing dies away until it is too small to release the wheel.",set:{len:.995,where:"earth",drive:0}}],quiz:[{q:"You make the pendulum four times longer. What happens to the period?",opts:["It stays the same","It doubles","It quadruples","It halves"],a:1,why:"The period goes with the square root of the length, and the square root of 4 is 2."},{q:"Which of these does not change the period of a small swing?",opts:["The length of the pendulum","The strength of gravity","The mass of the bob","All three change it"],a:2,why:"Mass cancels out: a heavier bob is pulled harder but is also harder to move."},{q:"Why does the escapement push the pendulum a little on every swing?",opts:["To make it swing faster","To replace the energy lost to air and friction","To keep the wheel from turning","To make the tick louder"],a:1,why:"Without the push, drag would wear the swing away. The escapement gives back exactly what is lost, and the swing settles where the two are equal."}],era:"Huygens, 1657",level:4,parts:[{name:"Pendulum",note:"The timekeeper. Its length and gravity fix the beat."},{name:"Anchor and pallets",note:"Rock with the pendulum. The pallets hold the wheel and then let it go."},{name:"Escape wheel",note:"Has 30 teeth here. It moves on half a tooth for every beat."},{name:"Drive",note:"A falling weight or a spring. It turns the wheel and, through the pallets, pushes the pendulum."}],facts:["Christiaan Huygens patented the first pendulum clock in 1657. It cut the error of a good clock from about 15 minutes a day to about 15 seconds.","A pendulum about 0.994 m long beats seconds, which is why longcase clocks are so tall: the pendulum needs a metre to hang.","Big Ben is kept to time by adding or taking away old pennies on its pendulum. One penny changes the rate by two fifths of a second a day.","The dead-beat escapement drawn here was worked out by Richard Towneley around 1675 and made famous by George Graham in 1715."],sources:["M. V. Headrick, *Clock and Watch Escapement Mechanics* (1997), on the Graham dead-beat escapement.",'R. A. Nelson and M. G. Olsson, "The pendulum: rich physics from a simple system", *American Journal of Physics* 54 surface enough energy to escape as vapour. It takes about 2.5 megajoules to evaporate a kilogram of sea water, which is why evaporation cools the sea. About 90 percent of the water vapour in the air comes from oceans, lakes and rivers, and the rest from plants."},{h:"Rising and cooling",p:"The wind forces the damp air up the slope. Higher up the pressure is lower, so the air expands and cools, by about 9.8 \xB0C for every kilometre while it is unsaturated."},{h:"Condensation",p:"Once the air has cooled to its dew point it can hold no more vapour. The vapour condenses on tiny specks into cloud droplets, and gives back the heat that evaporation took in. The air now cools more slowly, by about 4 to 6.5 \xB0C per kilometre."},{h:"Rain and return",p:"Droplets join until they are heavy enough to fall. The rain runs down the slope in rivers to the sea. The air, now drier and warmed by the heat that was released, sinks on the far side and warms again at 9.8 \xB0C per kilometre."}],principle:{lead:"The water cycle is a heat engine run by sunlight. Evaporation stores heat in the vapour, condensation releases it high up, and gravity returns the water.",eqs:[{label:"Evaporation from the sea",eq:"E = \u03C1 C~E~ U (q~s~ \u2212 q~a~)",note:"U is the wind speed. q_s is the vapour the air could hold right at the sea surface and q_a what it already holds. C_E is about 1.2 \xD7 10\u207B\xB3. Double the wind and the evaporation doubles."},{label:"How much air can hold",eq:"e~s~ = 6.11 exp( 17.6 T / (T + 243) ) hPa",note:"Warm air holds much more vapour: about 7 percent more for every degree. This is the Clausius\u2013Clapeyron relation."},{label:"Height of the cloud base",eq:"z \u2248 125 (T \u2212 T~d~)",note:"z in metres, with the air temperature T and the dew point T_d in \xB0C. The drawing uses the more exact Bolton formula, which agrees to a few percent."},{label:"Heat released by condensation",eq:"\u0394T = L~v~ \u0394q / c~p~",note:"Each gram of vapour that condenses in a kilogram of air warms that air by about 2.5 \xB0C. This is why the far side of the mountain is warmer."}],points:["The chart shows the air's temperature against height. The dashed grey line is where the air would be if no cloud formed. The gap at the crest is the heat released by condensation, and that same heat is what warms the air on the far side.","The air that comes down the far side has lost its water but kept the heat, and so it is warm and dry. This is the **rain shadow**, and it is why deserts lie behind many mountain ranges.","**What this model leaves out:** only a 400 m layer of air is lifted, and 60 percent of the water that condenses on the way to the crest falls as rain over a 40 km slope. The other 40 percent evaporates again on the way down the far side, which cools the sinking air a little. Real rain is patchy and varies a lot from place to place. Snow, plants, groundwater and the sea itself cooling are not modelled."]},myth:{claim:"Clouds are made of water vapour.",truth:'Water vapour is an invisible gas, like the rest of the air. A cloud is made of tiny liquid droplets (or ice crystals), which form only once the vapour has condensed. The white "steam" above a kettle is the same thing: droplets, a little way from the spout where the vapour has cooled.'},tries:[{label:"Warm tropical sea",text:"A warm sea, damp air and a tall mountain: heavy rain.",set:{sea:30,rh:85,wind:8,ridge:2500}},{label:"Cold sea",text:"Less than a third of the evaporation, and noticeably less rain.",set:{sea:8,rh:80,wind:7,ridge:1800}},{label:"Low hills",text:"The hills are below the cloud base, so there is no cloud and no rain.",set:{sea:26,rh:80,wind:7,ridge:300}},{label:"Dry air",text:"With 50 percent humidity the cloud base is about 1.4 km up. A 1.8 km ridge barely reaches it.",set:{sea:26,rh:50,wind:7,ridge:1800}},{label:"Big mountain",text:"The tallest ridge: most rain, and the hottest, driest air on the far side.",set:{sea:26,rh:80,wind:7,ridge:3e3}},{label:"Gale",text:"Double the wind: double the evaporation and double the rain.",set:{sea:26,rh:80,wind:14,ridge:1800}}],quiz:[{q:"Why does the cloud start partway up the slope and not at the sea?",opts:["The air has to rise and cool to its dew point first","The mountain is colder than the sea","Clouds only form over land","Sea water does not evaporate"],a:0,why:"Air at the sea is not cool enough to be saturated. It has to rise, expand and cool until it reaches the dew point, which for these conditions is a few hundred metres up."},{q:"What happens to the heat taken up when the sea water evaporated?",opts:["It is lost for good","It is released again when the vapour condenses into cloud","It warms the sea","It turns into wind"],a:1,why:"The heat is stored in the vapour (latent heat). When the vapour condenses the heat comes back, which is why air in a cloud cools more slowly as it rises."},{q:"Why is the air on the far side of the mountain warmer and drier than when it left the sea?",opts:["The Sun is stronger there","It lost its water as rain, kept the heat from condensation, and sinking air warms by compression","The mountain heats it","It came from a desert"],a:1,why:"Rain removes the water, condensation has added heat to the air, and air sinking down the far side warms by about 9.8 \xB0C per kilometre as it is squeezed."}],era:"Perrault, 1674",level:3,parts:[{name:"Sun",note:"Supplies the energy for evaporation."},{name:"Sea",note:"The main source of the vapour."},{name:"Cloud",note:"Condensed droplets, formed above the cloud base."},{name:"Mountain",note:"Forces the damp air upward so it cools."},{name:"River",note:"Carries the rain back to the sea."}],facts:["The oceans hold about 96.5 percent of the water on Earth. About 90 percent of the water vapour in the air comes from evaporation from oceans, seas, lakes and rivers, and the rest from plants.","A water molecule spends about nine days in the air on average before it falls as rain or snow.","In 1674 Pierre Perrault measured the ra
